<h1 mat-dialog-title>Confirmar Eliminación</h1>
<div mat-dialog-content>
  <p>¿Deseas eliminar el comprobante de {{data.mes}}?</p>
</div>
<div mat-dialog-actions align="end">
  <button mat-raised-button color="accent" (click)="onNoClick()">Cancelar</button>
  <button mat-raised-button color="warn" [mat-dialog-close]="true">Eliminar</button>
</div>
