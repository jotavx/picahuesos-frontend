<mat-dialog-content>
  <div class="mat-elevation-z8">
    <mat-form-field>
      <mat-label>Buscar</mat-label>
      <input matInput (keyup)="applyFilter($event)" placeholder="" #input>
    </mat-form-field>
    <mat-tab-group (selectedTabChange)="filtrarPorCategoria($event.tab.textLabel)">
      <mat-tab label="Todos" value="Todos"></mat-tab>
      <mat-tab label="Mosquitos" value="Mosquitos"></mat-tab>
      <mat-tab label="PMM" value="PMM"></mat-tab>
      <mat-tab label="PreMini" value="PreMini"></mat-tab>
      <mat-tab label="Mini" value="Mini"></mat-tab>
      <mat-tab label="U13" value="U13"></mat-tab>
      <mat-tab label="U15" value="U15"></mat-tab>
      <mat-tab label="U17" value="U17"></mat-tab>
      <mat-tab label="Primera" value="Primera"></mat-tab>
    </mat-tab-group>
    <table class="table table-striped" mat-table [dataSource]="dataSource" matSort>

      <ng-container matColumnDef="seleccionar">
        <th class="seleccion" mat-header-cell *matHeaderCellDef> Seleccionar </th>
        <td class="seleccion" mat-cell *matCellDef="let row">
          <mat-checkbox (change)="seleccionarAlumno($event, row)"></mat-checkbox>
        </td>
      </ng-container>

      <ng-container matColumnDef="nombreCompleto">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Nombre Completo </th>
        <td mat-cell class="fw-bold name" *matCellDef="let row"> {{row.nombre}} </td>
      </ng-container>

      <ng-container matColumnDef="categoria">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Categoría </th>
        <td mat-cell *matCellDef="let row"> {{row.categoria}} </td>
      </ng-container>


      <ng-container matColumnDef="email">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Email </th>
        <td mat-cell *matCellDef="let row"> {{row.email}} </td>
      </ng-container>

      <ng-container matColumnDef="mesAbonado">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Mes Abonado </th>
        <td mat-cell *matCellDef="let row" [style.color]="getColorForFechaAbonado(row.mesAbonado)" class="fw-bold">
          {{ row.mesAbonado | date: 'dd/MM/yyyy' }}
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

      <tr class="mat-row" *matNoDataRow>
        <td class="mat-cell" colspan="4">No hay datos que coincidan con el filtro:"{{input.value}}"</td>
      </tr>
    </table>
    <mat-paginator [pageSizeOptions]="[5]" aria-label="Select page of users"></mat-paginator>
  </div>
</mat-dialog-content>
<mat-dialog-actions align="end">

  <button mat-raised-button color="accent" mat-dialog-close>Volver</button>
  <button mat-raised-button color="primary" type="submit" (click)="agregarCorreos()">Aplicar</button>

</mat-dialog-actions>
