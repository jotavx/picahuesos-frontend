<h2 mat-dialog-title class="text-center ">Enviar Email</h2>
<mat-dialog-content>
  <div class="card">
    <div class="card-body">
      <form [formGroup]="datosCorreo">

        <mat-form-field appearance="fill">
          <mat-label>Lista destinatarios</mat-label>
          <mat-select (selectionChange)="seleccionarDestinatarios($event.value)">
            <mat-option disabled selected>Seleccionar destinatarios</mat-option>
            <mat-option value="todos">Todos los alumnos</mat-option>
            <mat-option value="mosquitos">Mosquitos</mat-option>
            <mat-option value="PMM">PMM</mat-option>
            <mat-option value="PreMini">PreMini</mat-option>
            <mat-option value="Mini">Mini</mat-option>
            <mat-option value="U13">U13</mat-option>
            <mat-option value="U15">U15</mat-option>
            <mat-option value="U17">U17</mat-option>
            <mat-option value="Primera">Primera</mat-option>
          </mat-select>
        </mat-form-field>
        <button mat-raised-button color="primary" class="ms-3 mb-3" (click)="abrirDialogoSeleccionAlumnos()">Elegir
          destinatario</button>
        <button mat-raised-button color="accent" class="ms-3 mb-3" (click)="limpiarEmails()">Limpiar emails</button>
        <br>
        <label class="form-label mt-1 mb-2 fw-bold text-white">Emails</label>
        <textarea type="text" class="form-control" placeholder="nombre@ejemplo.com" formControlName="correo"
          [value]="listaCorreosSeleccionada" readonly></textarea>
        <label class="form-label mt-1 mb-2 fw-bold text-white">Asunto</label>
        <input type="text" class="form-control" placeholder="Título" formControlName="asunto">
        <label class="form-label mt-1 mb-2 fw-bold text-white" mb-2>Mensaje</label>
        <textarea class="form-control" rows="
        10" formControlName="mensaje" placeholder="Mensaje"></textarea>
      </form>
      <!-- <button mat-raised-button color="primary" class=" float-end mt-2" (click)="envioCorreo()">Enviar</button>
      <button mat-raised-button color="accent" mat-button mat-dialog-close class="float-end mx-2 mt-2">Volver</button> -->

    </div>
  </div>

  <div *ngIf="loading" class="spinner-border text-dark float-end m-2 " role="status">
    <span class="visually-hidden">Loading...</span>
  </div>
  <br><br><br>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-raised-button color="accent" mat-dialog-close>Volver</button>
  <button mat-raised-button color="primary" type="submit" class="" (click)="envioCorreo()">Aplicar</button>
</mat-dialog-actions>
