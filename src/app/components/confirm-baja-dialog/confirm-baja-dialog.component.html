<h1 mat-dialog-title>Dar de baja</h1>
<div mat-dialog-content>
  ¿Deseas dar de baja el registro?</div>

  <button mat-raised-button color="accent" mat-button mat-dialog-close>Cancelar</button>
  <button mat-raised-button color="warn" style="margin-left: 15px" mat-button mat-dialog-close
    (click)="confirmarBaja()">Dar de Baja</button>
</div>
